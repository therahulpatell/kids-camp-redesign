<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found — Kids Camp</title>
    <meta name="description" content="Oops! This page is lost in the play area. Let's get you back to Kids Camp.">
    <link rel="icon" type="image/webp" href="logo.webp">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800;900&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00aeed;
            --primary-light: #66d0f7;
            --primary-dark: #008bc0;
            --secondary: #F472B6;
            --secondary-light: #F9A8D4;
            --tertiary: #FBBF24;
            --bg: #FFFDF5;
            --text: #1E293B;
            --text-light: #475569;
            --radius-md: 24px;
            --radius-lg: 32px;
            --radius-xl: 48px;
            --shadow-lg: 0 16px 48px rgba(30,41,59,0.12);
            --transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            overflow: hidden;
            position: relative;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(3deg); }
        }
        @keyframes float-reverse {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(20px) rotate(-3deg); }
        }
        @keyframes blob-morph {
            0%, 100% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
            50% { border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%; }
        }

        .shape { position: absolute; pointer-events: none; z-index: 0; opacity: 0.15; }
        .shape-1 { width: 400px; height: 400px; background: var(--tertiary); top: -100px; right: -100px; animation: float 8s ease-in-out infinite; border-radius: 50%; }
        .shape-2 { width: 300px; height: 300px; background: var(--secondary); bottom: -50px; left: -100px; animation: float-reverse 10s ease-in-out infinite; border-radius: 50%; }
        .shape-3 { width: 250px; height: 250px; background: var(--primary-light); top: 20%; left: 10%; animation: float 7s ease-in-out infinite; animation-delay: 1s; border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; animation: blob-morph 8s ease-in-out infinite; }

        .container {
            max-width: 560px;
            text-align: center;
            position: relative;
            z-index: 2;
            background: white;
            padding: 3.5rem 2rem;
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg);
            border: 4px solid rgba(0, 174, 237, 0.05);
        }

        .error-code {
            font-family: 'Outfit', sans-serif;
            font-size: 7rem;
            font-weight: 900;
            color: var(--primary);
            line-height: 1;
            margin-bottom: 1rem;
            position: relative;
            display: inline-block;
        }
        .error-code::after {
            content: '';
            position: absolute;
            bottom: 5px;
            left: -5%;
            width: 110%;
            height: 20%;
            background: var(--tertiary);
            opacity: 0.4;
            z-index: -1;
            border-radius: 4px;
            transform: rotate(-2deg);
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 1.25rem;
            color: var(--text);
            line-height: 1.2;
        }

        p {
            color: var(--text-light);
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 2.5rem;
        }

        .emoji {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            display: inline-block;
            animation: float 4s ease-in-out infinite;
        }

        .btn-home {
            background: var(--primary);
            color: white;
            padding: 1rem 2.25rem;
            border-radius: 100px;
            font-weight: 700;
            font-size: 1.05rem;
            font-family: 'Outfit', sans-serif;
            text-decoration: none;
            transition: var(--transition);
            box-shadow: 0 8px 24px rgba(0,174,237,0.3);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .btn-home:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 32px rgba(0,174,237,0.45);
            background: var(--primary-dark);
        }

        @media (max-width: 480px) {
            .container { padding: 2.5rem 1.5rem; }
            .error-code { font-size: 5rem; }
            h1 { font-size: 1.75rem; }
            p { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <!-- Ambient Shapes -->
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>

    <div class="container">
        <div class="emoji">🧸</div>
        <div class="error-code">404</div>
        <h1>Oh Oh! Page is Lost in the Play Area!</h1>
        <p>It looks like this page wandered off, hidden behind the toy blocks or playing hide-and-seek. Let's guide you back to the main camp!</p>
        <a href="index.html" class="btn-home">
            🏠 Back to Kids Camp
        </a>
    </div>

</body>
</html>
